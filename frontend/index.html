<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventario Proy2</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <section class="login-screen" id="loginScreen">
      <form class="login-panel" id="loginForm" novalidate>
        <span class="brand-mark">IP</span>
        <div>
          <p class="eyebrow">Acceso al sistema</p>
          <h1>Inventario Proy2</h1>
        </div>
        <label>
          Usuario
          <input id="loginUser" type="text" placeholder="user" autocomplete="username" required />
        </label>
        <label>
          Contraseña
          <input
            id="loginPassword"
            type="password"
            placeholder="contraseña"
            autocomplete="current-password"
            required
          />
        </label>
        <p class="form-error" id="loginError" role="alert"></p>
        <button class="primary-button" type="submit">Entrar</button>
        <button class="text-button" type="button" id="createAccountButton">Crear cuenta</button>
      </form>
    </section>

    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegacion principal">
        <a class="brand" href="/dashboard" data-nav="dashboard">
          <span class="brand-mark">IP</span>
          <span>
            <strong>Inventario</strong>
            <small>Proyecto 2 BD</small>
          </span>
        </a>

        <nav class="nav-list">
          <a class="nav-item active" href="/dashboard" data-nav="dashboard">
            <span class="icon" aria-hidden="true">IN</span>
            Inicio
          </a>
          <a class="nav-item" href="/productos" data-nav="productos">
            <span class="icon" aria-hidden="true">PR</span>
            Productos
          </a>
          <a class="nav-item" href="/compras" data-nav="compras">
            <span class="icon" aria-hidden="true">CO</span>
            Compras
          </a>
          <a class="nav-item" href="/reportes" data-nav="reportes">
            <span class="icon" aria-hidden="true">RP</span>
            Reportes
          </a>
          <a class="nav-item" href="/proveedores" data-nav="proveedores">
            <span class="icon" aria-hidden="true">PV</span>
            Proveedores
          </a>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="menu-button" id="menuButton" aria-label="Abrir menu">Menu</button>
          <div>
            <p class="eyebrow">Tienda · Inventario y ventas</p>
            <h1 id="pageTitle">Inicio</h1>
          </div>
          <div class="topbar-actions">
            <label class="search">
              <span aria-hidden="true">Buscar</span>
              <input id="globalSearch" type="search" placeholder="Producto, categoria o proveedor" />
            </label>
            <button class="ghost-button" type="button" id="logoutButton">Salir</button>
          </div>
        </header>

        <div class="views-root" id="viewsRoot"></div>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js?v=5"></script>
  </body>
</html>
